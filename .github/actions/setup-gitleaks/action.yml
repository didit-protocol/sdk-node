# Installs the pinned gitleaks release for the secret scans of ci.yml and spec-sync.yml.
# The official gitleaks-action needs a paid licence for organisations, so the release
# binary is downloaded and verified against its published SHA-256. Bump both by hand.
name: Set up gitleaks
description: Download the pinned gitleaks release, check its SHA-256 and put it on PATH.
runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        bin="$RUNNER_TEMP/gitleaks-bin"
        mkdir -p "$bin"
        curl -sSfL --retry 3 -o "$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" -C "$bin" gitleaks
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/gitleaks" version
