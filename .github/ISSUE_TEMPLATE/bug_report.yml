name: Bug report
description: Something in the Didit TypeScript / JavaScript SDK does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, webhook secrets, access or refresh tokens, or personal data**
        (names, documents, images, addresses, phone numbers, emails) into this issue.
        Replace them with placeholders such as `YOUR_API_KEY`.

        To report a security vulnerability, do not open an issue: see [SECURITY.md](https://github.com/didit-protocol/sdk-node/blob/main/SECURITY.md).
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: 'Output of `node -p "require(''@didit-protocol/sdk-node'').VERSION"`.'
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Node.js 22.11, Bun 1.2, Deno 2.1, Cloudflare Workers"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem, with secrets and personal data removed.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead, including the full error and stack trace.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id
      description: The `requestId` of the failing API call, if any (from `APIStatusError.requestId` or `.withResponse()`).
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Confirmation
      options:
        - label: I removed every API key, secret, token and piece of personal data from this issue.
          required: true
