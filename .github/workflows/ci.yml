# Continuous integration for the Didit TypeScript SDK (docs/DESIGN.md section 11).
# Every third-party action is pinned by full commit SHA; Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs also start the live smoke tests (job live-smoke) when the
  # DIDIT_SANDBOX_API_KEY secret is set.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded runs of a pull request; every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (eslint, prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm exec eslint .
      - name: prettier --check
        run: pnpm exec prettier --check .

  typecheck:
    name: Type check (tsc strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: tsc (SDK, tests, generator, examples; and the package without Node.js types)
        run: pnpm typecheck

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Regenerate and compare with the committed code
        # Fails when src/resources, src/types, tests/generated or api.md differ from
        # what codegen/ produces from openapi/. Fix: pnpm generate
        run: pnpm generate:check
      - name: A spec sync that renames and removes methods needs no hand edit
        # Runs last: it changes openapi/ and the generated code of this job's checkout.
        # Upstream renames every server method and drops one operation; the sync keeps
        # the old names as deprecated, and the checks of spec-sync.yml must still pass.
        run: |
          upstream="$RUNNER_TEMP/upstream"
          node codegen/tests/simulate-upstream.ts "$upstream"
          pnpm spec-sync --from-dir "$upstream" --summary "$RUNNER_TEMP/spec-sync-summary.md"
          pnpm generate
          pnpm exec eslint .
          pnpm exec prettier --check .
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:package

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          # Adds the core coverage gate to the Linux Node 22 job.
          - os: ubuntu-latest
            node: 22
            coverage: true
          # Runs the Linux Node 20 job far from UTC, so date handling cannot depend on the host's zone.
          - os: ubuntu-latest
            node: 20
            tz: Pacific/Kiritimati
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: vitest
        if: ${{ !matrix.coverage }}
        env:
          TZ: ${{ matrix.tz || 'UTC' }}
        run: pnpm test
      - name: vitest with the core coverage gate (90 %)
        if: ${{ matrix.coverage }}
        run: pnpm test:coverage

  build:
    name: Build and check the package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (tsup, ESM and CommonJS with declarations)
        run: pnpm build
      - name: publint and are-the-types-wrong
        run: pnpm check:package
      - name: Smoke test of the built package (ESM and CommonJS)
        run: |
          node tests/smoke/smoke.mjs
          node tests/smoke/smoke.cjs
      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  runtimes:
    name: Smoke test (${{ matrix.runtime }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node18, bun, deno, workerd]
    env:
      # Cloudflare's Workers runtime, from npm. Pinned; bump it by hand.
      WORKERD_VERSION: "1.20261016.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Set up Node.js 18
        if: matrix.runtime == 'node18'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Set up Node.js (to install workerd)
        if: matrix.runtime == 'workerd'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Set up Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Run the smoke test
        run: |
          case "${{ matrix.runtime }}" in
            node18)
              node tests/smoke/smoke.mjs
              node tests/smoke/smoke.cjs
              ;;
            bun)
              bun tests/smoke/smoke.mjs
              bun tests/smoke/smoke.cjs
              ;;
            deno) deno run --allow-read --allow-net=127.0.0.1 tests/smoke/smoke.mjs ;;
            workerd)
              npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/workerd" "workerd@${WORKERD_VERSION}"
              "$RUNNER_TEMP/workerd/node_modules/.bin/workerd" serve tests/smoke/workerd.capnp --experimental &
              pid=$!
              status=000
              for _ in $(seq 1 60); do
                status="$(curl -s -o "$RUNNER_TEMP/workerd.out" -w '%{http_code}' http://127.0.0.1:8787/ || true)"
                [ "$status" != "000" ] && break
                sleep 0.5
              done
              kill "$pid"
              cat "$RUNNER_TEMP/workerd.out"
              echo
              [ "$status" = "200" ]
              ;;
          esac

  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The official gitleaks-action needs a paid licence for organisations, so the
      # release binary is downloaded and verified against its published SHA-256.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out the repository with its full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .'

  live-smoke:
    name: Live smoke tests (sandbox)
    # Never part of default CI (docs/DESIGN.md section 11): manual runs only, and only
    # when the DIDIT_SANDBOX_API_KEY repository secret is set.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          DIDIT_SANDBOX_API_KEY: ${{ secrets.DIDIT_SANDBOX_API_KEY }}
        run: |
          if [ -n "$DIDIT_SANDBOX_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DIDIT_SANDBOX_API_KEY is not set; the live smoke tests are skipped."
          fi
      - name: Check out the repository
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: steps.key.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: vitest (live)
        if: steps.key.outputs.present == 'true'
        # The key reaches only this step, through the environment; it is never printed.
        # Optional repository variables: DIDIT_SANDBOX_WORKFLOW_ID, DIDIT_SANDBOX_BASE_URL.
        env:
          DIDIT_SANDBOX_API_KEY: ${{ secrets.DIDIT_SANDBOX_API_KEY }}
          DIDIT_SANDBOX_WORKFLOW_ID: ${{ vars.DIDIT_SANDBOX_WORKFLOW_ID }}
          DIDIT_SANDBOX_BASE_URL: ${{ vars.DIDIT_SANDBOX_BASE_URL }}
        run: pnpm test:live
